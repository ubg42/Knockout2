<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=yes" />
    <!-- Page info and stylesheets -->
    <title>knockout</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <!-- Unity canvas -->
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>
    <!-- Unity loader script -->
<script>
const unityApp = {
    applyCommonFixes: function () {
        // Add your common fixes here.
    },

    tryRotationLock() {
        // Add your rotation lock here.
    },

    tryLockAspectRatio() {
        // Add your aspect ratio code here.
    },

    loadSplitFile: async function (basePath) {
        const chunks = [];
        let totalLength = 0;

        for (let part = 1; part <= 15; part++) {
            const partName =
                `${basePath}.part${String(part).padStart(2, "0")}`;

            console.log(
                `Loading part ${part}/15: ${partName}`
            );

            const response = await fetch(partName);

            if (!response.ok) {
                throw new Error(
                    `Failed to load ${partName}: ${response.status}`
                );
            }

            const chunk = new Uint8Array(
                await response.arrayBuffer()
            );

            chunks.push(chunk);
            totalLength += chunk.length;
        }

        const merged = new Uint8Array(totalLength);

        let offset = 0;

        for (const chunk of chunks) {
            merged.set(chunk, offset);
            offset += chunk.length;
        }

        console.log(
            `Combined ${chunks.length} parts: ${totalLength} bytes`
        );

        return merged.buffer;
    },

    startLoading: async function () {
        const canvas =
            document.querySelector("#unity-canvas");

        const loadingBar =
            document.querySelector("#unity-loading-bar");

        const progressBarFull =
            document.querySelector("#unity-progress-bar-full");

        const buildUrl = "Build";

        const loaderUrl =
            `${buildUrl}/knockout[8]-mirraSDK[5.1.2].loader.js`;

        const config = {
            arguments: [],

            dataUrl:
                `${buildUrl}/knockout[8]-mirraSDK[5.1.2].data.br`,

            frameworkUrl:
                `${buildUrl}/knockout[8]-mirraSDK[5.1.2].framework.js.br`,

            codeUrl: "",

            streamingAssetsUrl: "StreamingAssets",

            companyName: "DefaultCompany",
            productName: "knockout",
            productVersion: "0.1.0",

            showBanner: (msg, type) => {
                if (type === "error") {
                    console.error(msg);
                } else {
                    console.warn(msg);
                }
            }
        };

        /*
         * Load all 15 parts.
         *
         * IMPORTANT:
         * These files currently appear to contain WAT text:
         *
         * 28 6d 6f 64 75 6c 65 0a
         * ( m  o  d  u  l  e \n
         *
         * That is NOT a WASM binary.
         */
        const wasmBuffer = await this.loadSplitFile(
            `${buildUrl}/knockout[8]-mirraSDK[5.1.2].wasm.br`
        );

        const bytes = new Uint8Array(wasmBuffer);

        const header = Array.from(
            bytes.slice(0, 16)
        )
            .map(b =>
                b.toString(16).padStart(2, "0")
            )
            .join(" ");

        const text = new TextDecoder().decode(
            bytes.slice(0, 32)
        );

        console.log("Combined file header:", header);
        console.log("Combined file text:", text);

        /*
         * A real WASM binary must begin with:
         *
         * 00 61 73 6d
         *
         * If it starts with:
         *
         * 28 6d 6f 64
         *
         * then it is WAT text and cannot be passed
         * directly to WebAssembly.instantiate().
         */
        if (
            bytes[0] !== 0x00 ||
            bytes[1] !== 0x61 ||
            bytes[2] !== 0x73 ||
            bytes[3] !== 0x6d
        ) {
            throw new Error(
                "The 15 parts do not contain a compiled WASM binary.\n\n" +
                `Header: ${header}\n\n` +
                `Text: ${text}`
            );
        }

        /*
         * Only reached when the file is actually WASM.
         */
        config.codeUrl = URL.createObjectURL(
            new Blob(
                [wasmBuffer],
                {
                    type: "application/wasm"
                }
            )
        );

        loadingBar.style.display = "block";

        const script =
            document.createElement("script");

        script.src = loaderUrl;

        script.onload = () => {
            createUnityInstance(
                canvas,
                config,
                (progress) => {
                    progressBarFull.style.width =
                        `${100 * progress}%`;
                }
            )
                .then(() => {
                    loadingBar.style.display = "none";
                })
                .catch((message) => {
                    console.error(message);
                    alert(message);
                });
        };

        script.onerror = () => {
            console.error(
                `Failed to load Unity loader: ${loaderUrl}`
            );
        };

        document.body.appendChild(script);
    },

    isMobile: function () {
        return /iPhone|iPad|iPod|Android/i.test(
            navigator.userAgent
        );
    },

    isEmpty: function (value) {
        return (
            value === undefined ||
            value === null ||
            value === ""
        );
    },

    toBoolean: function (value) {
        return (
            value === true ||
            value === "true" ||
            value === 1 ||
            value === "1" ||
            value === "True"
        );
    },

    isNumber: function (value) {
        return (
            typeof value === "number" &&
            !isNaN(value)
        );
    },

    toNumber: function (value) {
        function handleMathExpression(str) {
            const mathMatch = str.match(
                /^(\d*\.?\d+)\s*([+\-*/])\s*(\d*\.?\d+)$/
            );

            if (!mathMatch) {
                return null;
            }

            const a = parseFloat(mathMatch[1]);
            const operator = mathMatch[2];
            const b = parseFloat(mathMatch[3]);

            const operators = {
                "+": (a, b) => a + b,
                "-": (a, b) => a - b,
                "*": (a, b) => a * b,
                "/": (a, b) =>
                    b !== 0 ? a / b : NaN
            };

            return operators[operator](a, b);
        }

        function convertToNumber(str) {
            const num = parseFloat(str);
            return isNaN(num) ? 0 : num;
        }

        if (this.isNumber(value)) {
            return value;
        }

        if (this.isEmpty(value)) {
            return 0;
        }

        const str = String(value).trim();

        if (str === "") {
            return 0;
        }

        return (
            handleMathExpression(str) ||
            convertToNumber(str)
        );
    }
};

unityApp.applyCommonFixes();
unityApp.tryRotationLock();
unityApp.tryLockAspectRatio();
unityApp.startLoading();
</script>
  </body>
</html>
