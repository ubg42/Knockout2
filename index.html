<!DOCTYPE html>

<html lang="en-us">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=yes"/>
<!-- Page info and stylesheets -->
<title>knockout</title>
<link rel="shortcut icon" href="TemplateData/favicon.ico"/>
<link rel="stylesheet" href="TemplateData/style.css"/>
    <style>
        #wasm-loading-text {
    color: white;
    font-family: Arial, sans-serif;
    font-size: 16px;
    text-align: center;
    margin: 10px 0;
}
    </style>
<link rel="manifest" href="manifest.webmanifest"/>
</head>
<body>
    <div id="unity-loading-bar">
    <div id="unity-logo"></div>

    <div id="wasm-loading-text">
        Loading WASM Part 0/15
    </div>

    <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
    </div>
</div>
<!-- Unity canvas -->
<div id="unity-container">
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="unity-loading-bar">
<div id="unity-logo"></div>
<div id="unity-progress-bar-empty">
<div id="unity-progress-bar-full"></div>
</div>
</div>
</div>
<!-- Unity loader script -->
<script>
const unityApp = {

    applyCommonFixes: function () {
        // ...
    },

    tryRotationLock() {
        // ...
    },

    tryLockAspectRatio() {
        // ...
    },

loadSplitFile: async function (basePath) {
    const chunks = [];
    let totalLength = 0;

    const loadingText =
        document.querySelector("#wasm-loading-text");

    const progressBarFull =
        document.querySelector("#unity-progress-bar-full");

    for (let part = 1; part <= 15; part++) {

        const partName =
            `${basePath}.part${String(part).padStart(2, "0")}`;

        // Update text
        if (loadingText) {
            loadingText.textContent =
                `Loading WASM Part ${part}/15`;
        }

        console.log(
            `Loading WASM Part ${part}/15: ${partName}`
        );

        const response = await fetch(partName);

        if (!response.ok) {
            if (loadingText) {
                loadingText.textContent =
                    `Failed to load WASM Part ${part}/15`;
            }

            throw new Error(
                `Failed to load ${partName}: ${response.status}`
            );
        }

        const chunk = new Uint8Array(
            await response.arrayBuffer()
        );

        chunks.push(chunk);
        totalLength += chunk.length;

        // Update progress bar
        if (progressBarFull) {
            progressBarFull.style.width =
                `${(part / 15) * 100}%`;
        }

        console.log(
            `Loaded WASM Part ${part}/15 (${chunk.length} bytes)`
        );
    }

    // All parts downloaded
    if (loadingText) {
        loadingText.textContent =
            "Combining WASM Parts...";
    }

    console.log("Combining WASM Parts...");

    const merged = new Uint8Array(totalLength);

    let offset = 0;

    for (const chunk of chunks) {
        merged.set(chunk, offset);
        offset += chunk.length;
    }

    if (loadingText) {
        loadingText.textContent =
            "WASM Parts Loaded";
    }

    console.log(
        `Successfully combined ${chunks.length}/15 WASM parts (${totalLength} bytes)`
    );

    return merged.buffer;
}

// Load the 15 WASM parts
let wasmBuffer;

try {
    wasmBuffer = await this.loadSplitFile(
        buildUrl + "/knockout[8]-mirraSDK[5.1.2].wasm.br"
    );
} catch (error) {
    console.error("WASM part loading failed:", error);
    return;
}

        // Make the combined WASM available to Unity
        config.codeUrl = URL.createObjectURL(
            new Blob([wasmBuffer], {
                type: "application/wasm"
            })
        );

        const matchWebGLToCanvasSize = "";

        if (!this.isEmpty(matchWebGLToCanvasSize)) {
            config.matchWebGLToCanvasSize =
                this.toBoolean(matchWebGLToCanvasSize);
        }

        const autoSyncPersistentDataPath = "";

        if (!this.isEmpty(autoSyncPersistentDataPath)) {
            config.autoSyncPersistentDataPath =
                this.toBoolean(autoSyncPersistentDataPath);
        }

        const devicePixelRatio = this.toNumber("");

        if (this.isNumber(devicePixelRatio)) {
            config.devicePixelRatio = devicePixelRatio;
        }

        loadingBar.style.display = "block";

        const script = document.createElement("script");
        script.src = loaderUrl;

        script.onload = () => {
            createUnityInstance(
                canvas,
                config,
                (progress) => {
                    progressBarFull.style.width =
                        100 * progress + "%";
                }
            )
            .then(() => {
                loadingBar.style.display = "none";
            })
            .catch((message) => {
                console.error(message);
                alert(message);
            });
        };

        document.body.appendChild(script);
    },

    isMobile: function () {
        return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    },

    isEmpty: function (value) {
        return value === undefined ||
            value === null ||
            value === "";
    },

    toBoolean: function (value) {
        return value === true ||
            value === "true" ||
            value === 1 ||
            value === "1" ||
            value === "True";
    },

    isNumber: function (value) {
        return typeof value === "number" && !isNaN(value);
    },

    toNumber: function (value) {
        function handleMathExpression(str) {
            const mathMatch =
                str.match(
                    /^(\d*\.?\d+)\s*([+\-*/])\s*(\d*\.?\d+)$/
                );

            if (!mathMatch) return null;

            const a = parseFloat(mathMatch[1]);
            const operator = mathMatch[2];
            const b = parseFloat(mathMatch[3]);

            const operators = {
                '+': (a, b) => a + b,
                '-': (a, b) => a - b,
                '*': (a, b) => a * b,
                '/': (a, b) =>
                    b !== 0 ? a / b : NaN
            };

            return operators[operator](a, b);
        }

        function convertToNumber(str) {
            const num = parseFloat(str);
            return isNaN(num) ? 0 : num;
        }

        if (this.isNumber(value)) return value;
        if (this.isEmpty(value)) return 0;

        const str = String(value).trim();

        if (str === "") return 0;

        return (
            handleMathExpression(str) ||
            convertToNumber(str)
        );
    }
};

unityApp.applyCommonFixes();
unityApp.tryRotationLock();
unityApp.tryLockAspectRatio();
unityApp.startLoading();
</script>
</body>
</html>
